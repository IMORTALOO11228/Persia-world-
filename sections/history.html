<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تاریخ ایران | جهان پارس</title>
  <meta name="description" content="سفر در هزاره‌ها: تاریخ کامل ایران از عیلام تا جمهوری اسلامی">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Vazirmatn:wght@300;400;500;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/history.css">
</head>
<body>

  <!-- هدر -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand">
        <span class="brand-fa">جهان پارس</span>
        <span class="brand-en">PERSIA · WORLD</span>
      </a>
      <div class="header-actions">
        <a href="../index.html" class="lang-toggle" style="text-decoration:none;">← خانه</a>
      </div>
    </div>
  </header>

  <!-- عنوان صفحه -->
  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumb">
        <a href="../index.html">خانه</a><span>›</span>
        <span style="color: var(--gold);">تاریخ ایران</span>
      </nav>
      <h1 class="hero-title">تاریخ ایران</h1>
      <p class="hero-subtitle">سفری در هزاره‌ها؛ از عیلام تا جمهوری اسلامی</p>
    </div>
  </section>

  <!-- گرید سلسله‌ها -->
  <section class="container">
    <div class="history-grid" id="historyGrid">
      <!-- کارت‌های ۳۳ سلسله توسط فایل history.js در اینجا ساخته می‌شوند -->
    </div>
  </section>

  <!-- مودال جزئیات (پنجره بازشو) -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-box">
      <button class="detail-close" id="detailClose" aria-label="بستن">✕</button>

      <!-- بخش بالا: نقشه + پرچم بزرگ -->
      <div class="detail-top">
        <div class="detail-flag-wrap">
          <img id="detailFlag" src="" alt="پرچم">
        </div>
        <div class="detail-map-wrap">
          <img id="detailMap" src="" alt="نقشه قلمرو">
        </div>
      </div>

      <!-- اطلاعات -->
      <h2 id="detailName"></h2>
      <div class="detail-meta">
        <span id="detailYears"></span>
        <span id="detailCapital"></span>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <!-- فوتر -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-logo">جهان پارس</div>
      <p class="footer-text">ساخته شده با عشق به ایران باستان</p>
      <div class="footer-links">
        <a href="../index.html">خانه</a>
        <a href="../index.html#sections">دروازه‌ها</a>
        <a href="../index.html#about">درباره</a>
      </div>
      <div class="footer-divider"></div>
      <p class="footer-copy">© 2025 Persia World</p>
    </div>
  </footer>

  <!-- 🚨 این خط بسیار مهم است! فایل جاوااسکریپت را به صفحه وصل می‌کند و با نسخه جدید از کش شدن جلوگیری می‌کند -->
  <script src="../assets/js/history.js?v=200"></script>

</body>
</html>
