<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موجودات افسانه‌ای | جهان پارس</title>
  <meta name="description" content="گنجینه‌ای از موجودات افسانه‌ای ایران باستان">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Vazirmatn:wght@300;400;500;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    /* ─── استایل‌های مخصوص صفحه موجودات ─── */

    /* عنوان صفحه */
    .page-hero {
      padding: 100px 24px 60px;
      text-align: center;
      position: relative;
    }

    .breadcrumb {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .breadcrumb a { color: var(--gold); }
    .breadcrumb a:hover { color: var(--gold-light); }
    .breadcrumb span { margin: 0 8px; }

    .page-hero .hero-title {
      font-size: clamp(2.5rem, 7vw, 4.2rem);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .page-hero .hero-subtitle {
      margin-bottom: 0;
    }

    /* گرید کارت‌های موجودات */
    .creatures-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
      padding: 40px 0 100px;
    }

    .creature-card {
      background: linear-gradient(135deg, rgba(15, 27, 61, 0.7), rgba(8, 19, 45, 0.9));
      border: 1px solid rgba(201, 162, 75, 0.25);
      border-radius: 4px;
      padding: 28px 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .creature-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at top right, rgba(201, 162, 75, 0.25), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .creature-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(201, 162, 75, 0.15);
    }
    .creature-card:hover::before { opacity: 1; }

    .creature-card h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--gold-light);
      line-height: 1.9;
    }

    .creature-card .cat {
      display: block;
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* حالت خالی */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-state p {
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 2;
    }

    /* پنل جزئیات (modal) */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 19, 45, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .detail-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .detail-box {
      background: linear-gradient(135deg, rgba(26, 42, 92, 0.95), rgba(15, 27, 61, 0.98));
      border: 1px solid var(--gold);
      border-radius: 6px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 40px;
      position: relative;
      box-shadow: 0 0 60px rgba(201, 162, 75, 0.25);
    }

    .detail-close {
      position: absolute;
      top: 16px;
      left: 16px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      font-family: var(--font-body);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-close:hover { background: var(--gold); color: var(--lapis-dark); }

    .detail-image {
      width: 100%;
      height: 300px;
      border-radius: 4px;
      background: rgba(15, 27, 61, 0.5);
      border: 1px dashed rgba(201, 162, 75, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.9rem;
      margin-bottom: 24px;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .detail-box h2 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      color: var(--gold-light);
      line-height: 1.7;
      margin-bottom: 4px;
    }

    .detail-cat {
      font-family: var(--font-body);
      color: var(--turquoise);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .detail-body {
      font-family: var(--font-body);
      color: var(--text-primary);
      font-size: 1rem;
      line-height: 2;
    }
    .detail-body p { margin-bottom: 16px; }

    /* ریسپانسیو */
    @media (max-width: 600px) {
      .page-hero { padding: 70px 20px 40px; }
      .creatures-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
      .creature-card { padding: 22px 14px; }
      .creature-card h3 { font-size: 1.25rem; }
      .detail-box { padding: 28px 20px; }
      .detail-image { height: 200px; }
      .detail-box h2 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <!-- ═══════════ هدر (هماهنگ با صفحه اصلی) ═══════════ -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand">
        <span class="brand-fa">جهان پارس</span>
        <span class="brand-en">PERSIA · WORLD</span>
      </a>
      <div class="header-actions">
        <a href="../index.html" class="lang-toggle" style="text-decoration:none;">← خانه</a>
      </div>
    </div>
  </header>

  <!-- ═══════════ عنوان صفحه ═══════════ -->
  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumb">
        <a href="../index.html">خانه</a><span>›</span>
        <span style="color: var(--gold);">موجودات افسانه‌ای</span>
      </nav>
      <h1 class="hero-title">موجودات افسانه‌ای</h1>
      <p class="hero-subtitle">سیمرغ، دیو، اژدها و دیگر موجودات اساطیری ایران زمین</p>
    </div>
  </section>

  <!-- ═══════════ گرید کارت‌ها ═══════════ -->
  <section class="container">
    <div class="creatures-grid" id="creaturesGrid">
      <!-- کارت‌ها به‌صورت خودکار از data/creatures.json ساخته می‌شوند -->
    </div>
  </section>

  <!-- ═══════════ پنل جزئیات ═══════════ -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-box">
      <button class="detail-close" id="detailClose" aria-label="بستن">✕</button>
      <div class="detail-image" id="detailImage">تصویر موجود</div>
      <h2 id="detailName"></h2>
      <div class="detail-cat" id="detailCat"></div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <!-- ═══════════ فوتر ═══════════ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-logo">جهان پارس</div>
      <p class="footer-text">ساخته شده با عشق به ایران باستان</p>
      <div class="footer-links">
        <a href="../index.html">خانه</a>
        <a href="../index.html#sections">دروازه‌ها</a>
        <a href="../index.html#about">درباره</a>
      </div>
      <div class="footer-divider"></div>
      <p class="footer-copy">© 2025 Persia World</p>
    </div>
  </footer>

  <!-- ═══════════ اسکریپت ═══════════ -->
  <script>
    let allCreatures = [];

    /* بارگذاری دیتا از فایل JSON */
    fetch('../data/creatures.json')
      .then(r => r.json())
      .then(data => {
        allCreatures = data.creatures || [];
        renderGrid();
      })
      .catch(err => {
        console.warn('خطا در بارگذاری دیتا:', err);
        showEmpty('دیتا هنوز آماده نیست.');
      });

    /* ساخت کارت‌ها */
    function renderGrid() {
      const grid = document.getElementById('creaturesGrid');
      grid.innerHTML = '';

      if (allCreatures.length === 0) {
        showEmpty('هنوز موجودی به این گنجینه افزوده نشده است.');
        return;
      }

      allCreatures.forEach(c => {
        const card = document.createElement('div');
        card.className = 'creature-card';
        card.innerHTML = `
          <h3>${c.name_fa}</h3>
          <span class="cat">${c.category_fa || ''}</span>
        `;
        card.addEventListener('click', () => openDetail(c));
        grid.appendChild(card);
      });
    }

    /* نمایش حالت خالی */
    function showEmpty(message) {
      document.getElementById('creaturesGrid').innerHTML =
        `<div class="empty-state"><p>${message}</p></div>`;
    }

    /* باز کردن پنل جزئیات */
    function openDetail(creature) {
      document.getElementById('detailName').textContent = creature.name_fa;
      document.getElementById('detailCat').textContent = creature.category_fa || '';
      document.getElementById('detailBody').innerHTML =
        `<p>${creature.full_fa || creature.short_fa || 'توضیحات به‌زودی...'}</p>`;

      const imgEl = document.getElementById('detailImage');
      if (creature.image && creature.image.trim() !== '') {
        imgEl.style.backgroundImage = `url('../${creature.image}')`;
        imgEl.textContent = '';
      } else {
        imgEl.style.backgroundImage = 'none';
        imgEl.textContent = 'تصویر این موجود به‌زودی اضافه می‌شود';
      }

      document.getElementById('detailOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    /* بستن پنل */
    function closeDetail() {
      document.getElementById('detailOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('detailClose').addEventListener('click', closeDetail);
    document.getElementById('detailOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'detailOverlay') closeDetail();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetail();
    });
  </script>

</body>
</html>
